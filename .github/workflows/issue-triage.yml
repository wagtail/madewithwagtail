name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  ISSUE_NUMBER: ${{ github.event.issue.number }}

jobs:
  triage:
    # Skip site submissions.
    if: contains(github.event.issue.body, '### Site URL') == false
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      # Label + comment.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRIAGE_LABEL: needs triage
      # Make sure `gh` works without a repo checkout.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/triage-comment.md
      - name: Label issue and comment
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "$TRIAGE_LABEL"
          gh issue comment "$ISSUE_NUMBER" --body-file .github/triage-comment.md
